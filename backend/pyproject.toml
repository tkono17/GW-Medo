[project]
name = "GW-Medoc"
version = "0.0.1"
authors = [
    { name = "Takanori Kono", email = "takanori.kono@gmail.com" }
]
description = "An application to manage meetings and documents"
readme = "README.md"
required_python = ">3.10"
dependencies = [
    "python-dotenv",
    "typer",
    "fastapi",
    "sqlmodel",
    "uvicorn[standard]",
    "tzdata",
#    "appbasics @ git+https://github.com/tkono17/appbasics.git@main"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "src/python/gw_medoc" ]

[project.scripts]
gwmedoc-manage = "gw_medoc.cli.manage:main"
gwmedoc-server = "gw_medoc.cli.server:main"
gwmedoc-cli = "gw_medoc.cli.cliapp:main"
